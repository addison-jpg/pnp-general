[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid-lang"
version = "0.3.0"
description = "asteroid: a small language for claims about Boolean circuits. Python evaluates, the Lean kernel decides, matplotlib draws."
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[project.scripts]
asteroid = "asteroid.cli:cli"

[tool.setuptools]
packages = ["asteroid"]
