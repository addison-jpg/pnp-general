# Builds asteroid.exe for Windows: the native Lean evaluator (asteroid/NATIVE.md), about 6 MB, no Python inside.
# Double-click opens the asteroid prompt (4ST>) in a console window (Windows Terminal on Windows 11).
# Run it by hand: Actions > exe > Run workflow. Never on push. It makes no release and no tag (QUIET):
# the exe is a workflow artifact and a bot commit of asteroid.exe at the repository root.
# Until 2026-11-25 this built a PyInstaller bundle of the tkinter window (asteroid/idle_exe.py), because the
# Lean binary was 122 MiB; it is now 6 MB (boards/tasks/asteroid-term.md, seat 1).
name: exe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Install elan (Lean's installer; the toolchain comes from asteroid/native/lean-toolchain)
        shell: pwsh
        run: |
          curl.exe -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -o elan-init.ps1
          .\elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.elan\bin"
      - name: Build the native asteroid (asteroid/native: no Mathlib, no dependencies)
        shell: pwsh
        working-directory: asteroid/native
        run: lake build asteroid
      - name: Icon and version info
        shell: pwsh
        run: |
          pip install pillow
          python -c "from PIL import Image; Image.open('asteroid/editors/vscode/images/icon.png').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"
          Copy-Item asteroid/native/.lake/build/bin/asteroid.exe asteroid.exe
          npm install --no-save rcedit@4.0.1
          node -e "require('rcedit')('asteroid.exe', { icon: 'icon.ico', 'version-string': { CompanyName: 'addison-jpg', ProductName: 'asteroid', FileDescription: 'asteroid (native evaluator)', LegalCopyright: 'MIT' }, 'file-version': '0.4.0', 'product-version': '0.4.0' }).then(() => console.log('rcedit ok'), e => { console.error(e); process.exit(1) })"
      - name: Smoke test (the build fails if the exe is broken)
        shell: pwsh
        run: |
          .\asteroid.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\asteroid.exe hello.ath --no-proof
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\asteroid.exe asteroid\tests\notgate.ath --no-proof
          if ($LASTEXITCODE -ne 1) { Write-Host "notgate should exit 1 (one forced false claim)"; exit 1 }
          ":quit" | .\asteroid.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host ("size: {0:N1} MB" -f ((Get-Item asteroid.exe).Length / 1MB))
      - uses: actions/upload-artifact@v4
        with: { name: asteroid-exe, path: asteroid.exe }
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # this job only: it commits asteroid.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: asteroid-exe }
      - name: Commit asteroid.exe to the repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asteroid.exe
          git commit -m "asteroid.exe: native build by the exe workflow [skip ci]" || { echo "no change"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
