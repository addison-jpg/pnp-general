# Posts asteroid's commits to Discord. Needs the repository secret DISCORD_WEBHOOK (a channel webhook URL).
# Read-only on the repository: it only sends a message out. Without a valid secret it does nothing and says so
# without printing the value.
name: asteroid to discord
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post asteroid's commits
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          url = os.environ.get("WEBHOOK", "").strip()
          if not re.fullmatch(r"https://discord(app)?\.com/api/webhooks/\d+/[\w-]+", url):
              print("DISCORD_WEBHOOK is missing or not a Discord webhook URL: nothing sent (value not shown)")
              sys.exit(0)
          repo = os.environ["REPO_URL"]
          for c in json.loads(os.environ["COMMITS"] or "[]"):
              if c["author"]["name"] != "asteroid":
                  continue
              text = f"**asteroid** committed [`{c['id'][:7]}`]({repo}/commit/{c['id']})\n```\n{c['message'][:1700]}\n```"
              body = json.dumps({"username": "asteroid", "content": text}).encode()
              req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json", "User-Agent": "asteroid-ci"})
              urllib.request.urlopen(req, timeout=20).read()
              print("posted", c["id"][:7])
          PY
