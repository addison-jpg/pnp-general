# Posts asteroid's commits to Discord. Needs the repository secret DISCORD_WEBHOOK (a channel webhook URL).
# Read-only on the repository; it only sends a message out. Without the secret it does nothing.
name: asteroid to discord
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post asteroid's commits
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT: ${{ toJSON(github.event) }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "no DISCORD_WEBHOOK secret: nothing sent"; exit 0; fi
          echo "$EVENT" > event.json
          python3 - <<'PY'
          import json, os, urllib.request
          ev = json.load(open("event.json")); repo = ev["repository"]["html_url"]
          for c in ev.get("commits", []):
              who = c["author"]["name"]; msg = c["message"]
              if who != "asteroid" and not msg.startswith("asteroid"): continue
              text = f"**asteroid** committed [`{c['id'][:7]}`]({repo}/commit/{c['id']})\n```\n{msg[:1700]}\n```"
              body = json.dumps({"username": "asteroid", "content": text}).encode()
              req = urllib.request.Request(os.environ["WEBHOOK"], data=body, headers={"Content-Type": "application/json", "User-Agent": "asteroid-ci"})
              urllib.request.urlopen(req, timeout=20).read()
              print("posted", c["id"][:7])
          PY
