# Compute jobs on GitHub runners (boards/tasks/git-compute.md; one-not/tools/tensor/README.md, "Structure between jobs").
# A job spec (JSON) names a Python entry point in the repo, its args, a shard count N (<= 20) and an output file name; it may name
# other specs it `needs`. The workflow plans the DAG (at most 4 levels), runs each level after the one below it, each spec as N shard
# jobs plus a merge (compute-job.yml), and hands every merged output to the specs that need it. One spec with no needs runs as before
# (artifacts `shard-i` and `merged`). Trigger: Actions > compute > Run workflow with `spec` = a path in the repo, or push to a
# workshop/compute/** branch (spec at compute/job.json on that branch).
# Writes: only the last job, `publish`, has a write token, and it pushes one commit to the `compute-cache` branch (cache packs and
# results), never to main. No release, no tag, no PR, no comment (QUIET).
name: compute
on:
  workflow_dispatch:
    inputs:
      spec:
        description: path to a job spec in the repo (its `needs` are run first)
        required: true
        default: workshop/compute/specs/fano_slack.json
      runner:
        description: runs-on label of the shard jobs (a GPU runner goes here; paid runners are the owner's decision)
        required: false
        default: ubuntu-latest
  push:
    branches: ['workshop/compute/**']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      l0: ${{ steps.p.outputs.l0 }}
      l1: ${{ steps.p.outputs.l1 }}
      l2: ${{ steps.p.outputs.l2 }}
      l3: ${{ steps.p.outputs.l3 }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          SPEC_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.spec || 'compute/job.json' }}
        run: python3 -I one-not/tools/tensor/dag.py plan "$SPEC_IN"
  l0:
    needs: plan
    strategy:
      fail-fast: false
      matrix: { job: '${{ fromJSON(needs.plan.outputs.l0) }}' }
    uses: ./.github/workflows/compute-job.yml
    with:
      spec: ${{ matrix.job.spec }}
      name: ${{ matrix.job.name }}
      matrix: ${{ matrix.job.matrix }}
      shards: ${{ matrix.job.shards }}
      prefix: ${{ matrix.job.prefix }}
      needs: ${{ matrix.job.needs }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
  l1:
    needs: [plan, l0]
    if: needs.plan.outputs.l1 != '[]'
    strategy:
      fail-fast: false
      matrix: { job: '${{ fromJSON(needs.plan.outputs.l1) }}' }
    uses: ./.github/workflows/compute-job.yml
    with:
      spec: ${{ matrix.job.spec }}
      name: ${{ matrix.job.name }}
      matrix: ${{ matrix.job.matrix }}
      shards: ${{ matrix.job.shards }}
      prefix: ${{ matrix.job.prefix }}
      needs: ${{ matrix.job.needs }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
  l2:
    needs: [plan, l1]
    if: needs.plan.outputs.l2 != '[]'
    strategy:
      fail-fast: false
      matrix: { job: '${{ fromJSON(needs.plan.outputs.l2) }}' }
    uses: ./.github/workflows/compute-job.yml
    with:
      spec: ${{ matrix.job.spec }}
      name: ${{ matrix.job.name }}
      matrix: ${{ matrix.job.matrix }}
      shards: ${{ matrix.job.shards }}
      prefix: ${{ matrix.job.prefix }}
      needs: ${{ matrix.job.needs }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
  l3:
    needs: [plan, l2]
    if: needs.plan.outputs.l3 != '[]'
    strategy:
      fail-fast: false
      matrix: { job: '${{ fromJSON(needs.plan.outputs.l3) }}' }
    uses: ./.github/workflows/compute-job.yml
    with:
      spec: ${{ matrix.job.spec }}
      name: ${{ matrix.job.name }}
      matrix: ${{ matrix.job.matrix }}
      shards: ${{ matrix.job.shards }}
      prefix: ${{ matrix.job.prefix }}
      needs: ${{ matrix.job.needs }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
  publish:
    # The only job with a write token. It appends one commit to the compute-cache branch: new cache packs and the result records.
    needs: [l0, l1, l2, l3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: cache-new-*, path: art/cache }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: '*merged', path: art/merged }
      - name: Commit packs and results to compute-cache (never main, never forced)
        run: |
          set -e
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p art
          for try in 1 2 3 4 5; do
            rm -rf br; mkdir br
            if git fetch -q --depth 1 origin compute-cache 2>/dev/null; then
              git worktree add -q --detach br FETCH_HEAD
            else
              git worktree add -q --detach br HEAD
              (cd br && git checkout -q --orphan "cc-$try" && git rm -rfq . && printf 'Content-addressed compute cache and job results (written by compute.yml; see one-not/tools/tensor/README.md on main).\n' > README)
            fi
            python3 -I one-not/tools/tensor/dag.py publish art br
            cd br; git add -A .
            if git diff --cached --quiet; then echo 'nothing new'; exit 0; fi
            git commit -q -m "compute run $GITHUB_RUN_ID: cache packs and results"
            if git push -q origin HEAD:refs/heads/compute-cache; then echo pushed; exit 0; fi
            cd ..; git worktree remove --force br; sleep $((try * 7))
          done
          echo 'could not push to compute-cache'; exit 1
