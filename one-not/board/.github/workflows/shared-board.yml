# Mirror every board branch (`board`, `board-*`) into the one shared board branch `shared-board`.
# Triggers: a push to any board branch (needs this file on that branch), every hour (runs
# from the default branch, so it covers boards that do not carry this file), and by hand.
# The sync script always comes from the default branch, so there is one copy to maintain.
name: shared-board

on:
  push:
    branches: [board, 'board-*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Sync board branches into shared-board
        run: bash .github/scripts/sync-shared-board.sh --push
